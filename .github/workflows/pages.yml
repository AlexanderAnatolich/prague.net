name: Build and deploy Prague website

on:
  push:
    branches: [main]
    paths:
      - "www/**"
      - "src/**"
      - "docs/llm-readme.txt"
      - "Directory.Build.props"
      - ".github/workflows/pages.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site + docs
    runs-on: ubuntu-latest
    steps:
      # A release event runs on the tag ref; the site itself always builds from main.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && 'main' || '' }}

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: www/site/package-lock.json

      # Every project multi-targets net9.0;net10.0, and DocFX compiles them
      # to extract the API reference, so both SDKs are needed.
      - name: Setup .NET 9 + 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Restore .NET solution
        run: dotnet restore Prague.Publish.slnf

      - name: Install DocFX
        run: dotnet tool update -g docfx

      # Same source of truth as release.yml: the newest stable (non-draft, non-prerelease)
      # GitHub release. <Version> in Directory.Build.props is only the bootstrap fallback.
      - name: Read library version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v=$(gh release list --limit 200 --json tagName,isPrerelease,isDraft \
              | jq -r '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -n1 || true)
          if [[ -z "$v" ]]; then
            v=$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' Directory.Build.props | head -1)
            echo "No stable release found; falling back to Directory.Build.props"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Prague version: $v"

      - name: Build landing (Vite, prerendered to static HTML)
        working-directory: www/site
        run: |
          npm ci
          npm run build

      - name: Build docs (DocFX)
        working-directory: www/docs
        run: docfx docfx.json --metadata _pragueVersion=${{ steps.version.outputs.version }}

      - name: Assemble _site
        run: |
          mkdir -p _site/docs
          cp -R www/site/dist/. _site/
          cp -R www/docs/_site/. _site/docs/
          cp docs/llm-readme.txt _site/llms-full.txt
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/docs/index.html
          test -f _site/docs/api/index.html
          grep -q 'Fast as' _site/index.html   # prerender actually ran
          grep -q "Prague v${{ steps.version.outputs.version }}" _site/docs/index.html   # version pill rendered

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
